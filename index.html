<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리들의 이야기</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <h1>우리들의 이야기</h1>

    <button id="createRoom">
      새로운 단톡방 만들기
    </button>

    <div class="join">
      <input id="roomCode" placeholder="방코드">
      <input id="nickname" placeholder="닉네임">

      <button id="joinRoom">
        들어가기
      </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
